[/Script/ProceduralEcosystem.EcosystemSettings]
; ===========================================================================
; ESTE FICHERO ES LA TABLA COMPLETA DE LA CALIBRACION, NO UN DELTA.
;
; Se fijan TODAS las claves con efecto ecologico, aunque coincidan con el valor
; por defecto de C++. Antes solo estaban algunas, y eso tenia dos consecuencias
; que no se ven hasta que muerden: (1) un cambio de default en C++ alteraba la
; ecologia de la simulacion sin que nada visible cambiase, y (2) la calibracion
; acababa siendo un HIBRIDO que nadie eligio -unos pocos valores ajustados a mano
; para un modelo conviviendo con defaults de otro-.
;
; Comprueba la cobertura con el comando  Eco.Config.Auditar.
; ===========================================================================

MasterSeed=12345
SecondsPerSimTick=0.500000
YearsPerTick=1.000000
MaxStepsPerFrame=4
bStartPaused=True

; --- Relieve -------------------------------------------------------------
; FIJADOS A PROPOSITO Y NO SE TOCAN: el campo de agua es el TWI de ESTE relieve,
; y toda la calibracion de optimos hidricos se apoya en sus percentiles. Cambiar
; cualquiera de estos valores invalida esa calibracion en silencio.
HeightfieldResolution=512
HeightfieldCellSizeCm=200.000000
HeightScaleCm=30000.000000
HeightfieldOctaves=8
TerrainBaseWavelengthM=700.000000
TerrainPersistence=0.500000
TerrainLacunarity=2.000000
TerrainWarpStrengthM=150.000000
TerrainWarpWavelengthM=400.000000
TerrainRidgeWeight=0.450000
bTerrainErosion=True
TerrainHydraulicDroplets=120000
TerrainErosionStrength=0.500000
TerrainThermalIterations=25
TerrainTalusAngleDeg=34.000000

; --- Campos de recurso ---------------------------------------------------
WaterOutputMax=20.000000
bFillWaterSinks=True
NutrientOutputMax=10.000000
NutrientPatchFrequency=0.000150
NutrientOctaves=3

; --- Rejilla de luz ------------------------------------------------------
; El voxel VERTICAL es independiente del horizontal. Con los dos a 400 cm, toda la
; banda donde ocurre la competencia de regeneracion -del suelo a los 4 m- cabia en
; una sola capa: las plantulas no existian como estrato en el campo de luz.
LightCoarseCellSizeCm=400.000000
LightCoarseCellSizeZCm=200.000000
LightRebuildEveryNTicks=1
; Baja de 8000: con la rejilla relativa al terreno basta cubrir el arbol mas alto
; mas un margen. 8000 pagaba decenas de capas permanentemente vacias cada tick.
LightCanopyHeadroomCm=2000.000000
; Baja de 800: reservaba DOS capas subterraneas y empujaba la primera capa con
; follaje 4 m por encima del suelo.
LightGroundClearanceCm=400.000000

; --- Copa y extincion de luz ---------------------------------------------
; La copa es una capa de opacidad en el tercio superior del arbol. Antes se le
; pasaba la altura ENTERA como profundidad de copa y la sombra se desvanecia justo
; a ras de suelo: el sotobosque quedaba a plena luz (p50 de luz de suelo = 0.99 con
; 17.000 arboles) y con el se apagaban los dos mecanismos de sucesion del modelo.
; Objetivo de calibracion, verificable con Eco.PercentilesCampos y Eco.Luz.Perfil:
; luz a ras de suelo con p50 entre 0.10 y 0.25, y > 0.85 en el apice de un adulto.
CanopyRadiusFraction=0.300000
CanopyDepthFraction=0.300000
CanopyLeafAreaIndex=4.000000
LightExtinctionK=0.500000
DiffuseLightFloor=0.040000

; --- Vigor ---------------------------------------------------------------
HeatmapSpeciesIndex=0
; BAJA DE 1.0. Con la luz normalizada a [0,1], KlMax=1.0 topaba fL en 0.50 para una
; heliofila incluso a pleno sol y en campo abierto: la luz era el minimo de Liebig
; en casi todo el mapa aunque no hubiera una sola copa. Y como fL apenas varia en el
; espacio (0.026 de recorrido) pero mucho entre especies (0.41), el modelo se
; reducia a un ranking global de tolerancia. Con 0.12, fL satura a pleno sol -en el
; claro limitan agua y nutrientes, que es donde el modelo sabe repartir nicho- y
; sigue cayendo en picado bajo dosel, que es donde la tolerancia debe decidir.
LightHalfSaturationMax=0.120000
bUseNicheResponse=True
; Minimum / GeometricMean / MinSupplyTimesNiche. Con min() puro la derivada respecto
; a los ejes no limitantes es CERO, asi que el reparto de nicho por agua y nutrientes
; queda desconectado del resultado en cuanto la luz impone el minimo.
VigorCombineMode=GeometricMean
; Rama derecha de la campana cuando la especie no penaliza el exceso. Recortar la
; respuesta a 1 por encima del optimo la vuelve monotona no decreciente, y entonces
; un optimo mas bajo es mejor-o-igual en el 100% de las celdas.
NicheExcessWidthScale=2.500000
; Coste de la tolerancia a la sombra (Amax = 1 - esto * ShadeTolerance). Sin el,
; ShadeTolerance sube fL a cualquier nivel de luz sin costar nada: ventaja monotona
; gratuita. Con 0.40 las curvas de la pionera y la climacica se cruzan en Q ~ 0.25.
ShadeToleranceAssimilationCost=0.400000

; --- Estres, supresion y mortalidad --------------------------------------
; NOTA sobre el par (LightHalfSaturationMax, StressVigorThreshold): estaban
; acoplados sin documentar. 0.43 se puso para caber justo por debajo del techo de
; 0.50 que imponia KlMax=1.0, dejando a toda la poblacion a 0.07 del abismo. Con el
; nuevo KlMax el techo sube a ~0.88 y 0.43 pasa a ser lo que pretendia ser: un
; filtro de habitat, no un impuesto universal. Se deja igual A PROPOSITO para no
; mover dos variables acopladas en la misma corrida.
StressVigorThreshold=0.430000
StressAccumulationRate=1.000000
StressRecoveryRate=0.500000
; Decaimiento proporcional: es lo que convierte el estres en una RAMPA continua. Sin
; el, su punto fijo es un escalon (0 exacto o 1) y dos especies separadas por
; centesimas de vigor quedan separadas por una diferencia de mortalidad infinita.
StressDecayRate=0.200000
StressMortalityWeight=0.200000
; La longevidad compra resistencia al estres cronico. Sin esto, los parametros de
; mortalidad son globales mientras el tiempo de crecimiento es un rasgo por especie:
; un impuesto anual igual para todos penaliza linealmente a la especie lenta, y su
; unica compensacion -la longevidad- actuaba sobre un canal que apenas participa.
LongevityStressExponent=0.500000
LongevityStressRefYears=300.000000
; Histeresis de la supresion (el umbral de ENTRADA es el de la especie). La
; supresion por estres es reversible; la senescencia por edad no. Antes compartian
; estado, asi que unos anos de mala racha condenaban de por vida a una plantula y el
; banco de plantulas -el mecanismo de coexistencia climacico- era imposible.
SuppressionExitStressFraction=0.400000

; --- Reproduccion y reclutamiento ----------------------------------------
; Semillas al ano de un adulto YA CRECIDO. Sustituye a SeedRatePerBiomass (borrada:
; era una clave huerfana que hacia creer que la calibracion antigua seguia vigente).
SeedsPerAdultPerYear=10.000000
; Saturacion de la fecundidad con la biomasa alcanzada. Con proporcionalidad lineal,
; crecer mas rapido daba a la vez mas individuos Y mas semillas por individuo -un
; bucle que convierte una ventaja moderada en dos ordenes de magnitud de lluvia de
; semillas- y ademas esterilizaba al arbol suprimido, impidiendole recuperarse.
SeedBiomassHalfSaturation=0.200000
GerminationRate=0.500000
GerminationBiomassFraction=0.010000
; (MinLightForGermination ya NO vive aqui: es un campo POR ESPECIE. Siendo global
;  obligaba a que todo el reclutamiento pasara por claros.)
ConspecificInhibitionRadiusCm=1500.000000
ConspecificHalfCount=2.000000
; La madre no cuenta contra sus propias semillas: si no, el ultimo adulto de una
; especie al borde de la extincion paga la penalizacion por verse a si mismo.
bExcludeMotherFromInhibition=True
; BAJA DE 500. A 5 m los discos de exclusion cubrian el 56% del mapa y rechazaban
; ~43% de las semillas, pero es un filtro CIEGO A LA ESPECIE: limita la densidad
; total sin repartir nicho, y de paso elimina el sotobosque, que es justo donde una
; tolerante deberia acumular su banco de plantulas.
MinGerminationSpacingCm=250.000000
bSpacingScalesWithSize=True

; --- Suelo: consumo y regeneracion ---------------------------------------
NutrientDecompositionFactor=0.300000
WaterRechargeRate=0.300000
WaterDiffusionRate=0.100000
NutrientRechargeRate=0.150000
NutrientDiffusionRate=0.200000
; El kernel radicular da peso EXACTAMENTE cero a los vecinos cuando su radio no
; supera el tamano de celda: con RootRadius 2 m y celdas de 200 cm, un adulto
; escribia UNA celda. Cada arbol se agotaba un pozo privado sin tocar el de nadie y
; la competencia subterranea no existia como interaccion.
MinRootRadiusCells=2.000000
; Tope de extraccion anual. Sin el, la demanda que excedia lo disponible se
; depositaba como cantidad NEGATIVA, se difundia a los vecinos bajandoles recurso de
; verdad y luego se destruia al recortar a cero: interferencia gratuita y masa no
; conservada.
MaxResourceUptakeFraction=0.500000

; --- Perturbacion: claros ------------------------------------------------
; DESACTIVADA (tasa 0) a proposito. Es el parametro mas sensible del modelo
; -demasiado frecuente y gana siempre la pionera, demasiado raro y gana siempre la
; climacica- y un claro sin banco de plantulas AMPLIFICA la exclusion en vez de
; corregirla. Activala (0.007 ~ rotacion de 140 anos) solo despues de comprobar con
; Eco.Demografia que existen suprimidos con edad media alta bajo dosel cerrado.
DisturbanceRatePerYear=0.000000
DisturbanceMinAreaM2=50.000000
DisturbanceMaxAreaM2=5000.000000
DisturbanceAreaExponent=2.000000
DisturbanceMortality=0.900000

; --- Rendimiento ---------------------------------------------------------
SpatialHashCellSizeCm=500.000000
TickChunkGrainSize=512

; ---------------------------------------------------------------------------
; LIMPIEZA
;
; Claves BORRADAS por quedarse huerfanas tras un renombrado. Ninguna las leia ya,
; pero al leer el fichero daban a entender que la calibracion antigua seguia
; vigente, que es peor que no estar:
;   SeedRatePerBiomass        -> SeedsPerAdultPerYear (biomasa relativa, no absoluta)
;   MinLightForGermination    -> campo POR ESPECIE en USpeciesData
;   CanopyShadowDensity       -> CanopyLeafAreaIndex (el grid acumula area foliar,
;                                no opacidad, y la luz sale de Beer-Lambert)
;   LightCellSizeXYCm / LightCellSizeZCm / LightCoarseLayers
;   TestTreeCanopyRadiusCm / ...Depth / ...Density
;   KlMax                     -> LightHalfSaturationMax
;
; Eco.Config.Auditar detecta automaticamente tanto las huerfanas como las
; propiedades sin clave, para que esta deriva no se repita.
; ---------------------------------------------------------------------------

