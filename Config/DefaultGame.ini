WindWpoCutoffCm=12000.000000
bWindOnImpostors=False

; --- 6.2 Materiales ---
bCanopyAOInstanceData=True
; 0 = sin nieve (laurisilva / bosque templado). Subelo si haces un bosque boreal.
MaxSnowAmount=0.000000

; --- 6.3 CO2 (doc. 6.3) ---
; OJO: cambia el resultado de la simulacion. Ponlo a False (o Eco.CO2.Enable 0)
; para reproducir bit a bit las corridas anteriores a la Fase 6.
bEnableCO2Factor=True
CO2MaxReduction=0.150000
CO2FullMixingHeightCm=2500.000000

; --- 6.4 Profiling y presupuesto de frame ---
; Milisegundos que el tick de simulacion puede consumir dentro de un frame.
; Al agotarlos, los ticks pendientes esperan al frame siguiente.
