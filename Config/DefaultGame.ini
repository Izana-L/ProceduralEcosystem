ImpostorRadiusCm=25000.000000
CullRadiusCm=120000.000000
RelevelEveryNFrames=5
InstanceScaleJitter=0.100000
ScaleUpdateThreshold=0.020000
MaxBakesPerFrame=2
bPrebakeLibraryOnStart=False
bInstancesCastShadow=True
bImpostorsCastShadow=False
; Fase 6: sube de 2 a 3 -> [0] fase estacional, [1] sequedad, [2] apertura de copa (AO)
NumInstanceCustomDataFloats=3

; --- Fase 5: ciclo de vida y dinamica ---
bSmoothHeroGrowth=True
HeroGrowthSmoothingSeconds=0.600000
DeathEventBufferSize=256
bAutoAdvanceSeason=True
bSeasonFollowsSimClock=True
VisualYearSeconds=24.000000
bEnableSoilLayer=True
MaxSnags=512
MaxLitter=4096
SnagHeightFraction=0.450000
SnagStandingSeconds=6.000000
SnagFallSeconds=4.000000
SnagLogSeconds=20.000000
LitterPerDeath=6
LitterCardCm=70.000000
LitterGroundOffsetCm=3.000000
LitterRadiusCm=300.000000
bSnagsCastShadow=True
bSoilFollowsTreeRendering=True
DecompositionDecayPerYear=0.500000
DecompositionPulseScale=1.000000
DecompositionPaintMax=20.000000

; ===========================================================================
